# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Fast checks on staged files on commit, whole-project checks on push.
# `make lint` runs the commit stage on all files; CI runs everything via `make check`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with ruff in uv.lock (`uv tree --package ruff`)
    rev: v0.17.1
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
