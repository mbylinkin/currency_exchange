# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Fast checks on staged files on commit, whole-project checks on push.
# `make lint` runs the commit stage on all files; CI runs everything via `make check`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with ruff in uv.lock (`uv tree --package ruff`)
    rev: v0.17.3
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
-   repo: https://github.com/jdx/jactionlint
    rev: v2.5.0
    hooks:
    # Workflows and dependabot.yml; shellcheck (built from Go) checks run: steps
    -   id: jactionlint-shellcheck
-   repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.0
    hooks:
    # Staged diff on commit
    -   id: betterleaks
    # Whole git history on push and in `make secrets` (CI). Live validation
    # (--validation) stays off: findings are never sent anywhere.
    -   id: betterleaks
        alias: betterleaks-history
        name: Detect hardcoded secrets in git history
        entry: betterleaks git --redact --no-banner
        stages: [pre-push, manual]
-   repo: https://github.com/google/osv-scanner
    rev: v2.7.0
    hooks:
    # Known vulnerabilities in uv.lock. Needs the network (osv.dev), so it runs
    # on push and in `make vulns`, not on commit. Exceptions: osv-scanner.toml
    -   id: osv-scanner
        args: [scan, source, --lockfile=uv.lock]
        stages: [pre-push, manual]
-   repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
    # Runs in Docker: the image is pinned by digest, so keep tag and digest in
    # sync with rev. Needs a running Docker daemon (Docker Desktop on Windows).
    -   id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
-   repo: local
    hooks:
    # typos, rumdl and agnix are dev dependencies: versions live in uv.lock
    -   id: typos
        name: typos (spelling)
        entry: uv run typos --force-exclude
        language: system
        types: [text]
    -   id: rumdl
        name: rumdl (Markdown lint, config in .rumdl.toml)
        entry: uv run rumdl check
        language: system
        types: [markdown]
    -   id: agnix
        name: agnix (agent instruction files)
        entry: uv run agnix --strict
        language: system
        files: (^|/)(CLAUDE|AGENTS)\.md$
    # Unused, missing and transitive dependencies (config in pyproject.toml)
    -   id: deptry
        name: deptry (dependencies)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: (\.py|^pyproject\.toml|^uv\.lock)$
    # Architecture contracts in [tool.importlinter] (pyproject.toml)
    -   id: import-linter
        name: import-linter (layers)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: (^src/.*\.py|^pyproject\.toml)$
    -   id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
