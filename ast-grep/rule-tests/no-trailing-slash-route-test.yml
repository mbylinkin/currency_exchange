id: no-trailing-slash-route
valid:
  - |
    @router.get("/currencies", response_model=list[schemas.Currency])
    def f(): ...
  - |
    @router.get("/currency/{code}")
    def f(): ...
  - |
    @router.get("/currency/", response_model=schemas.Currency, include_in_schema=False)
    def f(): ...
