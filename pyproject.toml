[project]
name = "currency-exchange"
version = "0.1.0"
description = "REST API for currencies, exchange rates and conversions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "agnix>=0.61.0",
    "ast-grep-cli>=0.51.1",
    "deptry>=0.25.1",
    "diff-cover>=11.0.1",
    "factory-boy>=3.3.3",
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "playwright>=1.64.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.3",
    "pytest-playwright>=0.10.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.17.3",
    "rumdl>=0.3.2",
    "sqlalchemy-utils>=0.43.0",
    "typos>=1.52.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest_env]
SERVER_HOST = "127.0.0.1"
SERVER_PORT = "8000"
APP_ENVIRONMENT = "TESTING"
APP_DEBUG = "false"
APP_DATABASE_URL = "sqlite:///./test.db"
APP_CORS_ORIGINS = '["http://localhost"]'
APP_CORS_HEADERS = '["*"]'

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.html]
directory = "tests/coverage"

[tool.coverage.report]
fail_under = 80
skip_empty = true

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make the alembic package first-party
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through calls in argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.mypy]
files = ["src", "tests", "e2e", "alembic", "run.py"]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# factory_boy is untyped: keep checking test bodies, but don't demand
# annotations on every fixture and factory call
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# No type hints or stubs published
module = ["sqlalchemy_utils"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy re-exports its API from submodules without __all__
module = ["factory", "factory.*"]
implicit_reexport = true

[tool.deptry]
# e2e/ is test code like tests/ (excluded by default): dev dependencies are fine there
extend_exclude = ["e2e"]

[tool.deptry.per_rule_ignores]
# FastAPI needs python-multipart at runtime to parse Form(...) bodies; nothing imports it
DEP002 = ["python-multipart"]

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Each domain package: router -> service -> schemas / exceptions"
type = "layers"
containers = ["src.currency", "src.exchange", "src.exchange_rate"]
layers = ["router", "service", "schemas | exceptions"]

[[tool.importlinter.contracts]]
name = "Domains depend one way: exchange -> exchange_rate -> currency"
type = "layers"
layers = ["src.main", "src.exchange", "src.exchange_rate", "src.currency"]
# Shared modules (database, models, exceptions, ...) sit outside the layers
exhaustive = false

[[tool.importlinter.contracts]]
name = "Only main imports routers"
type = "forbidden"
source_modules = ["src.*.service", "src.*.schemas", "src.*.exceptions"]
forbidden_modules = ["src.*.router"]

[[tool.importlinter.contracts]]
name = "Shared modules don't import domain packages"
type = "forbidden"
source_modules = ["src.constants", "src.database", "src.exceptions", "src.models", "src.settings", "src.utils"]
forbidden_modules = ["src.main", "src.currency", "src.exchange", "src.exchange_rate"]
