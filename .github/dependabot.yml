# Weekly dependency update PRs. CI (unit + e2e) checks each one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # One PR for all minor/patch bumps; each major bump gets its own
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile (python, uv)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
