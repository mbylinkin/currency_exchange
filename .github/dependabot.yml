# Weekly dependency update PRs. CI (unit + e2e) checks each one.
# cooldown: skip versions younger than a week, so a compromised release
# is likely to be yanked before it reaches a PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR for all minor/patch bumps; each major bump gets its own
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile (python, uv)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A new Python minor (3.14 -> 3.15) also changes .python-version and
    # requires-python, so it is upgraded by hand, not by Dependabot
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
