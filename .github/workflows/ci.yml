name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older runs, not those of other PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner image is pinned (not ubuntu-latest), so GitHub moving the alias to a
# new Ubuntu can't change the build. Bump it deliberately; Dependabot doesn't.
jobs:
  # The same command developers run before a change is done
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the secrets scan (make secrets)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      - run: make check

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: make test-e2e E2E_ARGS="--screenshot only-on-failure --tracing retain-on-failure --output test-results"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --wait returns once the api healthcheck passes
      - run: docker compose up --build --detach --wait
      - name: Smoke test
        run: |
          curl -fsS -X POST localhost:8000/currencies -d code=USD -d "name=US Dollar" -d 'sign=$'
          curl -fsS localhost:8000/currencies | grep -q '"code":"USD"'
          curl -fsS localhost:8080/js/app.js | grep -q 'http://localhost:8000'
      - if: failure()
        run: docker compose logs
