name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runner image is pinned (not ubuntu-latest), so GitHub moving the alias to a
# new Ubuntu can't change the build. Bump it deliberately; Dependabot doesn't.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      - run: make typecheck
      - run: make check-migrations
      - run: make test-cov

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: make test-e2e E2E_ARGS="--screenshot only-on-failure --tracing retain-on-failure --output test-results"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # --wait returns once the api healthcheck passes
      - run: docker compose up --build --detach --wait
      - name: Smoke test
        run: |
          curl -fsS -X POST localhost:8000/currencies -d code=USD -d "name=US Dollar" -d 'sign=$'
          curl -fsS localhost:8000/currencies | grep -q '"code":"USD"'
          curl -fsS localhost:8080/js/app.js | grep -q 'http://localhost:8000'
      - if: failure()
        run: docker compose logs
