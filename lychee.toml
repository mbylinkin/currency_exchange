# Link check for Markdown (lychee). Runs weekly in .github/workflows/scheduled.yml
# and locally with `make links`; not on PRs, since external sites are flaky.

# README's http://localhost:8000 etc. are examples for a running app
exclude_loopback = true
# A site that rate-limits us is up, not broken
accept = ["200..=299", "429"]
max_retries = 3
timeout = 20
